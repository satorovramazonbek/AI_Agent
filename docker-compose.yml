services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jarvis}
      POSTGRES_DB: jarvis
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${JARVIS_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis"]
      interval: 5s
      retries: 10

  jarvis:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      JARVIS_DATABASE_URL: postgresql://jarvis:${POSTGRES_PASSWORD:-jarvis}@db:5432/jarvis
      JARVIS_ALLOWED_ROOTS: '["/tmp/jarvis"]'
    ports:
      - "127.0.0.1:${JARVIS_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:

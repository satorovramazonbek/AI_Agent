[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "JARVIS — shaxsiy avtonom AI agent (MVP skeleti)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "aiogram>=3.4",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "anthropic>=2.6",
    "certifi>=2024.2",
]

[project.optional-dependencies]
telegram = ["telethon>=1.36"]
app = [
    "rumps>=0.4; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
]
voice = ["faster-whisper>=1.1", "av>=11,<19", "sounddevice>=0.4", "numpy>=1.26"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
jarvis-voice = "jarvis.voice.listen:main"
jarvis-telegram-login = "jarvis.tools.telegram_user:login_main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
jarvis = ["assets/*.png"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
